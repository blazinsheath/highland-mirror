[package]
name = "catplay_carplay"
version = "0.1.0"
edition = "2024"

[dependencies]

# CatPlay
catplay_mfi = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_hap = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_csm = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_bonjour = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_util = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_tracing = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_plist = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_ring = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_audio = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }

catplay_tokio = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }
catplay_iap2_client = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }

catplay_fairplay = { git = "https://github.com/cfraz89/catplay.git", branch = "master" }

# Plist
serde = { version = "1.0.219", features = ["derive"] }
bitflags = { version = "2.9.1" }

# HomeKit
uuid = { version = "1.16.0", default-features = false, features = [
    "v4",
    "rng-rand",
] }

# Async
tokio = { version = "1.48.0", features = [
    "io-util",
    "macros",
    "sync",
    "time",
    "rt",
    "net",
] }
futures = "0.3.31"
async-trait = "0.1.89"
bytes = "1.10.1"

# Others
libc = "0.2.183"
log = "0.4.27"
thiserror = "2.0.14"
exp-golomb = "0.1.0"
macaddr = "1.0.1"
rand = "0.9.2"

[dev-dependencies]
mockall = "0.13.1"
serde_json = "1.0"

[features]
tx = []
bonjour = []
tracing = []
default = ["tx", "bonjour", "tracing"]
