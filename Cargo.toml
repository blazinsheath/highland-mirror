[workspace]
resolver = "3"
exclude = ["vendor/catplay_carplay"]
members = [
    "carjack-linux",
    "carjack-android",
    "iap2-proto",
    "libcarjack",
    "cuda-dmabuf",
    "vendor/catplay_audio",
]
# A bare `cargo build`/`cargo run` is the Linux app; the Android core builds with the apps (`just slipstream`, `just motopod`).
default-members = ["carjack-linux"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

# Retain the pinned transport, with a raw RTSP request entry point and AAC-LC encoder.
[patch."https://github.com/cfraz89/catplay.git"]
catplay_audio = { path = "vendor/catplay_audio" }
catplay_carplay = { path = "vendor/catplay_carplay" }
